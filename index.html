<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamod OFFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Rajdhani', sans-serif; background: #000010; color: white; min-height: 100vh; overflow-x: hidden; }

/* වටේ කැරකෙන බල්බ් (Neon Bulbs) */
.bulb {
    position: fixed;
    width: 10px; height: 10px;
    background: #00eaff;
    border-radius: 50%;
    box-shadow: 0 0 15px #00eaff;
    z-index: 1000;
    animation: rotateBulbs 10s linear infinite;
}

@keyframes rotateBulbs {
    0% { transform: rotate(0deg) translateX(105vw) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(105vw) rotate(-360deg); }
}

/* ඉමොජි වැස්ස */
.emoji-rain {
    position: fixed; top: -50px; font-size: 24px; z-index: 5;
    pointer-events: none; animation: fallEmoji linear forwards;
}
@keyframes fallEmoji { 100% { transform: translateY(110vh) rotate(360deg); } }

/* WhatsApp Button & Label */
.wa-container { position: fixed; bottom: 80px; right: 20px; display: flex; flex-direction: column; align-items: center; z-index: 10003; }
.contact-label { font-size: 12px; font-weight: bold; color: #25D366; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
.whatsapp-btn { width: 60px; height: 60px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: white; box-shadow: 0 0 20px rgba(37, 211, 102, 0.6); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* ඉතිරි පරණ ස්ටයිල්ස් මෙතනට එයි */
.glitch { font-family: 'Orbitron', sans-serif; font-size: 45px; font-weight: 900; text-transform: uppercase; color: #fff; margin-top: 20px; }
.container { width: 90%; max-width: 800px; margin: auto; text-align: center; padding-top: 50px; }
.anime-fighter { width: 150px; height: 150px; border-radius: 20px; border: 3px solid #00eaff; box-shadow: 0 0 20px #00eaff; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
.card { padding: 20px; background: rgba(255,255,255,0.05); border: 1px solid #00eaff; border-radius: 15px; cursor: pointer; }
.music-btn { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: #000; border: 2px solid #00eaff; color: white; cursor: pointer; }
</style>
</head>

<body>

<!-- කැරකෙන බල්බ් -->
<div class="bulb" style="animation-delay: 0s;"></div>
<div class="bulb" style="animation-delay: 2s; background: #ff00a8;"></div>
<div class="bulb" style="animation-delay: 4s; background: #ffff00;"></div>

<!-- WhatsApp -->
<div class="wa-container">
    <div class="contact-label">CONTACT ME</div>
    <a href="https://wa.me/94703247462" target="_blank" class="whatsapp-btn">💬</a>
</div>

<div class="container">
    <img src="https://i.gifer.com/7efs.gif" class="anime-fighter">
    <h1 class="glitch">CHAMOD OFFICIAL</h1>
    
    <div class="menu">
        <div class="card"><h3>ABOUT</h3></div>
        <div class="card"><h3>PROJECTS</h3></div>
    </div>
</div>

<button class="music-btn" onclick="toggleMusic()" id="musicToggle">🎵 PLAY</button>
<div id="player" style="display:none;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // ඉමොජි වැස්ස
    function createEmoji() {
        const emojis = ['🔥', '✨', '⚡', '🌸', '💫', '💎'];
        const e = document.createElement('div');
        e.className = 'emoji-rain';
        e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = Math.random() * 100 + 'vw';
        e.style.animationDuration = Math.random() * 3 + 3 + 's';
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 6000);
    }
    setInterval(createEmoji, 500);

    // Music
    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', { videoId: 'QKY9jEIXfVQ', playerVars: { 'loop': 1, 'playlist': 'QKY9jEIXfVQ' }});
    }
    function toggleMusic() {
        if(player.getPlayerState() == 1) { player.pauseVideo(); document.getElementById('musicToggle').innerText="🎵 PLAY"; }
        else { player.playVideo(); document.getElementById('musicToggle').innerText="⏸️ PAUSE"; }
    }
</script>
</body>
</html>
